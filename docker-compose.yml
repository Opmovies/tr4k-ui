services:
  tr4k-ui:
    # image publiée à chaque release (docker compose pull pour mettre à jour) ;
    # `docker compose up -d --build` reconstruit localement si vous préférez
    image: ghcr.io/opmovies/tr4k-ui:latest
    build: .
    container_name: tr4k-ui
    restart: unless-stopped
    labels:
      # permet à watchtower (profil autoupdate) de cibler ce conteneur
      - com.centurylinklabs.watchtower.scope=tr4k-ui
    ports:
      - "${PORT:-3010}:3000"
    environment:
      # URL de base du tracker (surchageable)
      NUXT_TR4KER_BASE: ${NUXT_TR4KER_BASE:-https://tr4ker.net}
      # OBLIGATOIRE en prod : clé de chiffrement des sessions (openssl rand -hex 32)
      NUXT_SESSION_SECRET: ${NUXT_SESSION_SECRET:?NUXT_SESSION_SECRET requis (openssl rand -hex 32)}
      # Réservez ces admins de plugins en instance multi-comptes (ex: "12,34").
      # Sans ça, tout compte peut installer un plugin = exécution de code serveur.
      NUXT_PLUGIN_ADMINS: ${NUXT_PLUGIN_ADMINS:-}
      # Mise à jour de l'app en un clic depuis l'UI (délègue à watchtower).
      # Renseignez WATCHTOWER_TOKEN + lancez le profil autoupdate pour l'activer.
      NUXT_WATCHTOWER_URL: http://watchtower:8080
      NUXT_WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:-}
      NODE_ENV: production
    volumes:
      # persiste les plugins installés + leurs réglages chiffrés
      - tr4k-data:/app/.data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/auth/session"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---- auto-update (optionnel) ----
  # Met à jour tr4k-ui depuis l'image GHCR : automatiquement toutes les 6 h ET/OU
  # à la demande via le bouton « Mettre à jour maintenant » de l'UI (API HTTP).
  # Activer avec :  WATCHTOWER_TOKEN=... docker compose --profile autoupdate up -d

  # Proxy du socket Docker : watchtower n'accède PAS au socket brut (= root sur l'hôte),
  # mais seulement au sous-ensemble d'API nécessaire (conteneurs/images), en lecture du
  # socket. Durcissement recommandé.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: tr4k-ui-socket-proxy
    restart: unless-stopped
    profiles: [autoupdate]
    environment:
      CONTAINERS: 1   # lister/inspecter les conteneurs
      IMAGES: 1       # inspecter/tirer les images
      NETWORKS: 1     # ré-attacher les réseaux à la recréation
      POST: 1         # créer/démarrer/arrêter/supprimer (recréation)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # aucun port publié : joignable uniquement en interne par watchtower

  watchtower:
    # fork maintenu (containrrr/watchtower est abandonné et incompatible avec Docker ≥ 25)
    image: nickfedor/watchtower:latest
    container_name: tr4k-ui-watchtower
    restart: unless-stopped
    profiles: [autoupdate]
    depends_on:
      - docker-socket-proxy
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375 # passe par le proxy, pas le socket brut
      WATCHTOWER_SCOPE: tr4k-ui          # ne touche QUE le conteneur tr4k-ui
      WATCHTOWER_CLEANUP: "true"         # supprime les anciennes images
      WATCHTOWER_POLL_INTERVAL: "21600"  # vérif auto toutes les 6 h
      WATCHTOWER_HTTP_API_UPDATE: "true" # active le déclencheur HTTP (bouton UI)
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true" # garde aussi la vérif périodique
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:?WATCHTOWER_TOKEN requis pour le profil autoupdate (openssl rand -hex 16)}
    labels:
      - com.centurylinklabs.watchtower.scope=tr4k-ui

volumes:
  tr4k-data:
